<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM VOX - الأول في الشرق الأوسط</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 0 0 20px rgba(59, 130, 246, 0.3); }
            50% { text-shadow: 0 0 20px rgba(59, 130, 246, 0.9), 0 0 30px rgba(37, 99, 235, 0.7); }
        }
        .glowing-text {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-black tracking-wider text-white">SMM <span class="text-blue-500">VOX</span></h1>
            <div class="flex items-center space-x-3 space-x-reverse">
                <a href="https://wa.me/201093285651" target="_blank" class="bg-green-600/20 border border-green-500/40 text-green-400 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 hover:bg-green-600 hover:text-white transition">
                    <i class="fa-brands fa-whatsapp"></i> دعم واتساب
                </a>
                <a href="https://wa.me/201093285651" target="_blank" class="bg-sky-600/20 border border-sky-500/40 text-sky-400 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 hover:bg-sky-600 hover:text-white transition">
                    <i class="fa-brands fa-telegram"></i> دعم تليجرام
                </a>
            </div>
        </div>
    </header>

    <!-- Main Hero Banner (SMM VOX glowing box) -->
    <div class="max-w-7xl mx-auto px-4 mt-6 w-full">
        <div class="bg-gradient-to-r from-blue-900/40 via-gray-900 to-indigo-950/40 border border-blue-500/30 rounded-2xl p-6 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-blue-500/10 rounded-full blur-3xl"></div>
            <h2 class="text-3xl md:text-5xl font-black text-white tracking-widest uppercase glowing-text mb-2">SMM VOX</h2>
            <p class="text-blue-400 font-bold text-sm md:text-base tracking-wide">الأول في الشرق الأوسط للخدمات الرقمية وشحن الألعاب</p>
        </div>
    </div>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Services Section -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl shadow-xl">
                <h3 class="text-base font-bold mb-4 flex items-center gap-2 text-blue-400">
                    <i class="fa-solid fa-shapes"></i> الفئات المتاحة (اضغط على الفئة للفلترة)
                </h3>
                
                <!-- Category Filters (Cards/Boxes) -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6" id="categoryFilters">
                    <button onclick="filterCategory('all', this)" class="cat-card bg-blue-600 text-white p-3 rounded-xl text-xs font-bold transition shadow-md border border-blue-500 flex flex-col items-center gap-1 active-cat">
                        <i class="fa-solid fa-border-all text-base"></i> الكل
                    </button>
                    <button onclick="filterCategory('pubg', this)" class="cat-card bg-gray-800/80 hover:bg-gray-800 text-gray-300 p-3 rounded-xl text-xs font-bold transition border border-gray-700/60 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-gamepad text-base text-amber-400"></i> شدات ببجي
                    </button>
                    <button onclick="filterCategory('freefire', this)" class="cat-card bg-gray-800/80 hover:bg-gray-800 text-gray-300 p-3 rounded-xl text-xs font-bold transition border border-gray-700/60 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-fire text-base text-orange-500"></i> فري فاير
                    </button>
                    <button onclick="filterCategory('ai', this)" class="cat-card bg-gray-800/80 hover:bg-gray-800 text-gray-300 p-3 rounded-xl text-xs font-bold transition border border-gray-700/60 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-robot text-base text-purple-400"></i> الذكاء الاصطناعي
                    </button>
                    <button onclick="filterCategory('vpn', this)" class="cat-card bg-gray-800/80 hover:bg-gray-800 text-gray-300 p-3 rounded-xl text-xs font-bold transition border border-gray-700/60 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-shield-halved text-base text-emerald-400"></i> جير أب في بي إن
                    </button>
                    <button onclick="filterCategory('data', this)" class="cat-card bg-gray-800/80 hover:bg-gray-800 text-gray-300 p-3 rounded-xl text-xs font-bold transition border border-gray-700/60 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-database text-base text-sky-400"></i> سحب البيانات
                    </button>
                    <button onclick="filterCategory('civil', this)" class="cat-card bg-gray-800/80 hover:bg-gray-800 text-gray-300 p-3 rounded-xl text-xs font-bold transition border border-gray-700/60 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-id-card text-base text-rose-400"></i> السجل المدني
                    </button>
                </div>

                <h3 class="text-base font-bold mb-3 text-gray-300 border-t border-gray-800 pt-4">الخدمات المتاحة تحت الفئة المحددة</h3>
                
                <!-- Services Grid -->
                <div id="servicesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Services -->
                </div>
            </div>
        </div>

        <!-- Order Form Section -->
        <div class="space-y-6">
            <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl sticky top-24">
                <h3 class="text-base font-bold mb-4 flex items-center gap-2 text-green-400">
                    <i class="fa-solid fa-cart-shopping"></i> طلب أوردر جديد
                </h3>

                <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">الخدمة المختارة</label>
                        <select id="serviceSelect" onchange="updateServiceDetails()" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                            <option value="">اختر الخدمة أولاً...</option>
                        </select>
                    </div>

                    <div id="serviceDescriptionContainer" class="bg-gray-950/50 border border-gray-800/60 p-3 rounded-xl text-xs text-gray-400 hidden">
                        <span class="font-bold text-gray-300 block mb-1">وصف الخدمة:</span>
                        <p id="serviceDescriptionText"></p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1" id="inputLabel">المدخلات المطلوبة</label>
                        <input type="text" id="userInput" required placeholder="اختر الخدمة أولاً" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">الكمية / العدد</label>
                        <input type="number" id="quantityInput" value="1" min="1" oninput="calculateTotal()" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                    </div>

                    <div class="border-t border-gray-800 pt-4 flex justify-between items-center">
                        <span class="text-xs font-semibold text-gray-400">السعر النهائي:</span>
                        <span class="text-lg font-black text-green-400"><span id="totalPrice">0</span> جنيه</span>
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-green-600/30 flex items-center justify-center gap-2 text-sm">
                        <i class="fa-brands fa-whatsapp text-lg"></i> إتمام الطلب عبر واتساب
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        <p>جميع الحقوق محفوظة &copy; 2026 - SMM VOX</p>
    </footer>

    <!-- JavaScript Data and Logic -->
    <script>
        const whatsappNumber = "201093285651";

        const servicesData = [
            { id: 1, name: "شحن شدات ببجي - 60 UC", category: "pubg", price: 0, unit: "شدة", inputType: "id", inputPlaceholder: "أدخل معرف اللاعب (Player ID)", description: "شحن 60 شدة ببجي موبايل رسمياً وآمناً." },
            { id: 2, name: "شحن شدات ببجي - 120 UC", category: "pubg", price: 0, unit: "شدة", inputType: "id", inputPlaceholder: "أدخل معرف اللاعب (Player ID)", description: "شحن 120 شدة ببجي موبايل رسمياً وآمناً." },
            { id: 3, name: "شحن شدات ببجي - 325 UC", category: "pubg", price: 0, unit: "شدة", inputType: "id", inputPlaceholder: "أدخل معرف اللاعب (Player ID)", description: "شحن 325 شدة ببجي موبايل رسمياً وآمناً." },
            { id: 4, name: "شحن شدات ببجي - 660 UC", category: "pubg", price: 0, unit: "شدة", inputType: "id", inputPlaceholder: "أدخل معرف اللاعب (Player ID)", description: "شحن 660 شدة ببجي موبايل رسمياً وآمناً." },
            { id: 5, name: "شحن شدات ببجي - 1800 UC", category: "pubg", price: 0, unit: "شدة", inputType: "id", inputPlaceholder: "أدخل معرف اللاعب (Player ID)", description: "شحن 1800 شدة ببجي موبايل رسمياً وآمناً." },
            { id: 6, name: "شحن شدات ببجي - 3850 UC", category: "pubg", price: 0, unit: "شدة", inputType: "id", inputPlaceholder: "أدخل معرف اللاعب (Player ID)", description: "شحن 3850 شدة ببجي موبايل رسمياً وآمناً." },
            { id: 7, name: "شحن شدات ببجي - 8100 UC", category: "pubg", price: 0, unit: "شدة", inputType: "id", inputPlaceholder: "أدخل معرف اللاعب (Player ID)", description: "شحن 8100 شدة ببجي موبايل رسمياً وآمناً." },
            { id: 8, name: "شحن جواهر فري فاير", category: "freefire", price: 0, unit: "جوهرة", inputType: "id", inputPlaceholder: "أدخل معرف اللاعب (Player ID)", description: "شحن جواهر لعبة فري فاير بسرعة وأمان عن طريق الـ ID." },
            { id: 9, name: "اشتراك ChatGPT Plus", category: "ai", price: 0, unit: "شهر", inputType: "email", inputPlaceholder: "أدخل البريد الإلكتروني (Email)", description: "تفعيل اشتراك شات جي بي تي بلس على إيميلك الشخصي." },
            { id: 10, name: "اشتراك Gemini Advanced", category: "ai", price: 0, unit: "شهر", inputType: "email", inputPlaceholder: "أدخل البريد الإلكتروني (Email)", description: "تفعيل اشتراك جميناي أدفانسد من جوجل." },
            { id: 11, name: "اشتراك GearUP Booster (VPN)", category: "vpn", price: 0, unit: "شهر", inputType: "email", inputPlaceholder: "أدخل البريد الإلكتروني أو حساب التطبيق", description: "تسريع البنج وتقليل اللاق في الألعاب أونلاين." },
            { id: 12, name: "خدمات سحب البيانات", category: "data", price: 0, unit: "طلب", inputType: "phone", inputPlaceholder: "أدخل رقم الهاتف أو التفاصيل المطلوبة", description: "خدمات سحب واستعلام البيانات بدقة وسرعة." },
            { id: 13, name: "خدمات السجل المدني", category: "civil", price: 0, unit: "معاملة", inputType: "id", inputPlaceholder: "أدخل الرقم القومي / بيانات المعاملة", description: "استعلامات وخدمات السجل المدني والمعاملات الحكومية." }
        ];

        function renderServices(services) {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';
            
            if(services.length === 0) {
                grid.innerHTML = '<div class="text-center py-10 text-gray-500 col-span-full">لا توجد خدمات متاحة في هذه الفئة حالياً.</div>';
                return;
            }

            services.forEach(service => {
                grid.innerHTML += `
                    <div class="bg-gray-950 border border-gray-800 hover:border-blue-500/50 p-4 rounded-xl flex flex-col justify-between transition shadow-md">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <h4 class="font-bold text-white text-xs">${service.name}</h4>
                                <span class="bg-blue-600/20 text-blue-400 text-xs px-2 py-0.5 rounded-md font-semibold whitespace-nowrap">${service.price} جنيه</span>
                            </div>
                            <p class="text-[11px] text-gray-400 mb-3 line-clamp-2">${service.description}</p>
                        </div>
                        <button onclick="selectService(${service.id})" class="w-full bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/30 font-semibold py-1.5 rounded-lg text-xs transition">
                            اطلب الآن
                        </button>
                    </div>
                `;
            });
        }

        function populateSelect(services) {
            const select = document.getElementById('serviceSelect');
            select.innerHTML = '<option value="">اختر الخدمة...</option>';
            services.forEach(service => {
                select.innerHTML += `<option value="${service.id}">${service.name} (${service.price} ج.م)</option>`;
            });
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.cat-card').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'border-blue-500');
                btn.classList.add('bg-gray-800/80', 'text-gray-300', 'border-gray-700/60');
            });
            btnElement.classList.remove('bg-gray-800/80', 'text-gray-300', 'border-gray-700/60');
            btnElement.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'border-blue-500');

            if(category === 'all') {
                renderServices(servicesData);
            } else {
                const filtered = servicesData.filter(s => s.category === category);
                renderServices(filtered);
            }
        }

        function selectService(id) {
            const select = document.getElementById('serviceSelect');
            select.value = id;
            updateServiceDetails();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function updateServiceDetails() {
            const serviceId = document.getElementById('serviceSelect').value;
            const userInput = document.getElementById('userInput');
            const inputLabel = document.getElementById('inputLabel');
            const descContainer = document.getElementById('serviceDescriptionContainer');
            const descText = document.getElementById('serviceDescriptionText');

            if (!serviceId) {
                userInput.placeholder = "اختر الخدمة أولاً";
                inputLabel.innerText = "المدخلات المطلوبة";
                descContainer.classList.add('hidden');
                document.getElementById('totalPrice').innerText = '0';
                return;
            }

            const service = servicesData.find(s => s.id == serviceId);
            if (service) {
                userInput.placeholder = service.inputPlaceholder;
                inputLabel.innerText = service.inputPlaceholder;
                
                if (service.description) {
                    descText.innerText = service.description;
                    descContainer.classList.remove('hidden');
                } else {
                    descContainer.classList.add('hidden');
                }

                calculateTotal();
            }
        }

        function calculateTotal() {
            const serviceId = document.getElementById('serviceSelect').value;
            const quantity = document.getElementById('quantityInput').value || 1;
            
            if (!serviceId) {
                document.getElementById('totalPrice').innerText = '0';
                return;
            }

            const service = servicesData.find(s => s.id == serviceId);
            if (service) {
                const total = service.price * quantity;
                document.getElementById('totalPrice').innerText = total;
            }
        }

        function submitOrder(event) {
            event.preventDefault();
            const serviceId = document.getElementById('serviceSelect').value;
            const userInput = document.getElementById('userInput').value;
            const quantity = document.getElementById('quantityInput').value;

            if (!serviceId) {
                alert("الرجاء اختيار الخدمة المطلوبة");
                return;
            }

            const service = servicesData.find(s => s.id == serviceId);
            const total = service.price * quantity;

            let message = `مرحباً، أريد طلب الخدمة التالية من SMM VOX:%0A` +
                          `----------------------------------%0A` +
                          `📌 الخدمة: ${service.name}%0A` +
                          `📝 المدخلات (ID / البيانات): ${userInput}%0A` +
                          `🔢 الكمية: ${quantity} ${service.unit}%0A` +
                          `💰 السعر الإجمالي: ${total} جنيه%0A` +
                          `----------------------------------`;

            window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
        }

        // Initialize on load
        window.onload = function() {
            renderServices(servicesData);
            populateSelect(servicesData);
        };
    </script>
</body>
</html>
